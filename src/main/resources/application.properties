spring.application.name=order-integration-platform

server.port=8081

spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG


# ActiveMQ Artemis connection
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=admin
spring.artemis.password=password

# Camel JMS destination
app.jms.order-queue=order.queue

# Application information
management.info.env.enabled=true
info.app.name=OrderIntegrationPlatform
info.app.description=Apache Camel Order Integration Platform
info.app.version=1.0.0

# Apache Camel health monitoring
camel.health.enabled=true
camel.health.routes-enabled=true
camel.health.consumers-enabled=true

# Expose Camel management endpoints
management.endpoints.web.exposure.include=health,info,camelroutes

# Kafka broker
camel.component.kafka.brokers=localhost:9092

# Kafka topic
app.kafka.order-topic=orders

app.kafka.error-topic=orders-errors

management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.jms.enabled=true


